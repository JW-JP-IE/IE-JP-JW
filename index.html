<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>IE 工作台 · 江微</title>
<style>
:root{
  --bg:#f2f5f9;--card:#fff;--txt:#16203a;--sub:#7a8699;--line:#e4e9f2;
  --blue:#1e4d8c;--blue2:#2f6fed;--red:#e5484d;--green:#18a058;--amber:#e6a23c;--purple:#7c5cff;--teal:#0ea5a5;
  --shadow:0 1px 3px rgba(22,32,58,.06),0 4px 14px rgba(22,32,58,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#1e4d8c,#2f6fed);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:50}
header .row{display:flex;justify-content:space-between;align-items:flex-end}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header .who{font-size:11px;opacity:.8;margin-top:3px}
header .dt{font-size:11px;opacity:.85;text-align:right;line-height:1.5}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:49;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:66px;border:0;background:none;padding:10px 8px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:inherit}
nav button.on{color:var(--blue2);border-bottom-color:var(--blue2);font-weight:600}
main{padding:12px;max-width:1000px;margin:0 auto}
.page{display:none}.page.on{display:block;animation:f .18s}
@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:13px;margin-bottom:10px}
.card>h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.card>h3 .badge{font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:1px 6px;font-weight:500}
.card>h3 .more{margin-left:auto;font-size:11px;color:var(--blue2);font-weight:400;cursor:pointer}
/* 顶部 KPI */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.kpi>div{background:var(--card);border-radius:11px;box-shadow:var(--shadow);padding:10px 4px;text-align:center}
.kpi b{font-size:19px;display:block;line-height:1.25;font-weight:700}
.kpi span{font-size:10px;color:var(--sub)}
/* 六大板块入口 */
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.blk{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 12px;cursor:pointer;border-left:3px solid var(--blue2);position:relative;overflow:hidden}
.blk:active{transform:scale(.985)}
.blk .n{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.blk .d{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.45}
.blk .c{position:absolute;right:9px;top:9px;font-size:17px;font-weight:700;opacity:.16}
/* 标签 */
.tg{display:inline-block;font-size:10px;border-radius:4px;padding:1px 5px;margin-right:3px;font-weight:500;white-space:nowrap;line-height:1.5}
/* 任务行 */
.tk{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tk:last-child{border-bottom:0;padding-bottom:0}
.tk .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tk .body{flex:1;min-width:0}
.tk .ti{font-size:13px;font-weight:500;line-height:1.4;word-break:break-word}
.tk .mt{font-size:10px;color:var(--sub);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tk .op{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:10px;padding:2px 6px;color:var(--sub);cursor:pointer;flex-shrink:0;font-family:inherit}
/* 进度 */
.pb{height:5px;background:#edf1f7;border-radius:3px;overflow:hidden;margin:6px 0}
.pb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue2),var(--purple))}
/* 料号卡 */
.pn{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}
.pn .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pn .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--blue)}
.pn .nm{font-size:12px;margin-top:2px;line-height:1.4}
.pn .info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:10px}
.pn .info>div{background:#f7f9fc;border-radius:6px;padding:5px 7px}
.pn .info span{display:block;color:var(--sub);font-size:9px;margin-bottom:1px}
.pn .info b{font-size:11px;font-weight:600;word-break:break-all}
/* 版本时间轴 */
.vt{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.vt .v{display:flex;gap:8px;font-size:11px;padding:6px 0;position:relative}
.vt .v:not(:last-child):before{content:'';position:absolute;left:5px;top:17px;bottom:-3px;width:1px;background:var(--line)}
.vt .v .pt{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:2px;background:#fff;border:2px solid var(--blue2);z-index:1}
.vt .v .vb{flex:1;min-width:0}
.vt .v .vh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vt .v .ver{font-weight:700;color:var(--blue);font-size:11px}
.vt .v .vd{color:var(--sub);font-size:10px}
.vt .v .vn{font-size:10px;color:var(--txt);margin-top:2px;line-height:1.45;opacity:.8}
/* 表 */
.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb th{text-align:left;color:var(--sub);font-weight:500;font-size:10px;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:6px 4px;border-bottom:1px solid #f2f5f9;vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 柱状 */
.bars{display:flex;align-items:flex-end;gap:5px;height:88px;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.bars .b{width:100%;background:linear-gradient(180deg,#5b8def,#2f6fed);border-radius:3px 3px 0 0;min-height:2px;margin-top:auto}
.bars .l{font-size:9px;color:var(--sub);white-space:nowrap}
/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:8px;padding:8px 13px;font-size:12px;cursor:pointer;background:var(--blue2);color:#fff;font-family:inherit;font-weight:500}
.btn.ghost{background:#fff;color:var(--blue2);border:1px solid #c9d9f5}
.btn.gray{background:#f0f3f8;color:var(--sub)}
.btn.red{background:#fff;color:var(--red);border:1px solid #f3c6c7}
.btn.sm{padding:5px 9px;font-size:11px}
.btn:disabled{opacity:.45}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:540px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:640px){.modal{align-items:center;padding:20px}.modal .box{border-radius:14px;max-height:86vh}}
.modal h3{font-size:15px;margin-bottom:2px}
.modal .sub{font-size:11px;color:var(--sub);margin-bottom:10px}
.modal label{display:block;font-size:11px;color:var(--sub);margin:9px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:13px;background:#fafbfc;font-family:inherit;color:var(--txt)}
.modal textarea{min-height:70px;resize:vertical;line-height:1.5}
.r2{display:flex;gap:8px}.r2>div{flex:1}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--sub);font-family:inherit}
.chip.on{background:var(--blue2);color:#fff;border-color:var(--blue2);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:20px 0;font-size:12px}
.hint{font-size:11px;color:var(--sub);background:#f6f8fc;border-radius:7px;padding:7px 9px;margin-top:8px;line-height:1.6}
.warn{border-left:3px solid var(--red);padding-left:9px}
.warn.amber{border-left-color:var(--amber)}
/* 底栏 */
.bottombar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:55;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(22,32,58,.05)}
.bottombar button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:10px;color:var(--sub);cursor:pointer;font-family:inherit}
.bottombar button.on{color:var(--blue2);font-weight:600}
.bottombar button i{font-size:17px;display:block;font-style:normal;margin-bottom:1px}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#d92d20;color:#fff;font-size:12px;padding:9px 12px;line-height:1.5;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}}
</style>

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const nowISO=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmtN=n=>n==null||n===''?'—':(+n).toLocaleString('zh-CN');
const monOf=d=>d?d.slice(0,7):'';

/* ============ 数据层 ============ */
const KEY='ie_wb_v2';
const ST={std:'标准工时测定',jj:'计件单价制定',mp:'新项目人力评估',fin:'财务成本数据',au:'审计佐证',pr:'标准文件与流程'};

function seedData(){
  const S=window.SEED;
  const types=S.types.map(t=>({...t}));
  const tmap=Object.fromEntries(types.map(t=>[t.key,t]));
  const parts=S.partNos.map(p=>({
    ...p,
    hours:(p.hours||[]).map(h=>({...h})),
    cycleMonth:p.cycleMonth||6
  }));
  const tasks=S.tasks.map(t=>({
    id:uid(),title:t.title,type:t.type,pn:t.pn||'',due:t.due||'',pri:t.pri||'mid',
    stage:t.stage||'todo',detail:t.detail||'',reason:t.reason||'',
    hours:t.hours||0,created:nowISO(),done:false
  }));
  const bens=S.benefits.map(b=>({id:uid(),...b}));
  return {v:2,owner:S.meta.owner,dept:S.meta.dept,types,tasks,parts,bens,reasons:S.reasons,
    monthly:{...S.monthly},logs:[],lastMonthReport:''};
}
let DB=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return seedData();
    const d=JSON.parse(raw);
    if(!d||d.v!==2)return seedData();
    return d;
  }catch(e){return seedData()}
}
let LSOK=true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB))}
  catch(e){
    if(LSOK){LSOK=false;
      alert('提示：当前浏览器限制了本地存储（无痕/隐私模式）。本次修改刷新后会丢失，建议在普通窗口打开，或到「数据」页导出备份。');}
  }
  render();
}
/* 类型/归因查询 */
const tInfo=k=>DB.types.find(t=>t.key===k)||{name:k,color:'#94a3b8',short:k};
const rInfo=k=>DB.reasons.find(t=>t.key===k)||{name:'初始测定',color:'#94a3b8'};
function tgType(k){const t=tInfo(k);return `<span class="tg" style="background:${t.color}18;color:${t.color}">${esc(t.short||t.name)}</span>`}
function tgReason(k){if(!k)return '';const r=rInfo(k);return `<span class="tg" style="background:${r.color}18;color:${r.color}">${esc(r.name)}</span>`}

/* 工时新鲜度：距上次更新月数 */
function ageMonths(d){
  if(!d)return null;
  const a=new Date(d),b=new Date();
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}
function freshness(p){
  const m=ageMonths(p.lastUpdate);
  if(m===null)return {lvl:2,txt:'无记录',color:'var(--sub)'};
  const lim=p.cycleMonth||6;
  if(m>lim)return {lvl:0,txt:`超期 ${m-lim} 个月`,color:'var(--red)',m};
  if(m>lim-3)return {lvl:1,txt:`临近复测`,color:'var(--amber)',m};
  return {lvl:3,txt:`${m} 个月前更新`,color:'var(--green)',m};
}
/* 下次复测日期 */
function nextDate(p){
  if(!p.lastUpdate)return '';
  const d=new Date(p.lastUpdate);
  if(isNaN(d))return '';
  d.setMonth(d.getMonth()+(p.cycleMonth||6));
  const q=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+q(d.getMonth()+1)+'-'+q(d.getDate());
}
/* 汇总 */
function sum(){
  const tasks=DB.tasks;
  const open=tasks.filter(t=>t.stage!=='done');
  const benM=DB.bens.filter(b=>b.unit&&b.unit.indexOf('月')>=0).reduce((s,b)=>s+(+b.money||0),0);
  const benY=DB.bens.filter(b=>b.unit&&b.unit.indexOf('年')>=0).reduce((s,b)=>s+(+b.money||0),0);
  const stale=DB.parts.filter(p=>freshness(p).lvl<3).length;
  const over=tasks.filter(t=>t.stage!=='done'&&t.due&&t.due<today()).length;
  const hours=DB.parts.reduce((s,p)=>s+(p.hours.length||0),0);
  return {open:open.length,benM,benY,stale,over,parts:DB.parts.length,vers:hours,tasks:tasks.length};
}

/* ============ 导航 ============ */
const PAGES=[
  ['home','▦','工作台'],
  ['std','⚙','工时测定'],
  ['jj','¥','计件方案'],
  ['mp','👥','人力评估'],
  ['ben','◆','效益台账'],
  ['rep','▤','月度总结'],
  ['data','⛁','数据']
];
let cur='home';
function buildNav(){
  const mk=list=>list.map(p=>`<button data-p="${p[0]}"><i>${p[1]}</i>${p[2]}</button>`).join('');
  $('nav').innerHTML=mk(PAGES);
  $('bbar').innerHTML=mk(PAGES.filter(p=>['home','std','jj','ben','rep'].includes(p[0])));
  ['nav','bbar'].forEach(id=>{
    const el=$(id);
    if(!el||el.dataset.b)return;
    el.dataset.b='1';
    el.addEventListener('click',e=>{
      const b=e.target.closest('button[data-p]');
      if(b)go(b.dataset.p);
    });
  });
}
function go(p){
  if(!$('pg-'+p))p='home';
  cur=p;
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
  $('pg-'+p).classList.add('on');
  document.querySelectorAll('#nav button,#bbar button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  window.scrollTo(0,0);
  render();
}
function render(){
  try{
    const d=new Date();
    $('dt').innerHTML=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'<br>'+'周'+'日一二三四五六'[d.getDay()];
    $('who').textContent=DB.owner+' · '+DB.dept;
    const map={home:rHome,std:rStd,jj:rJj,mp:rMp,ben:rBen,rep:rRep,data:rData};
    (map[cur]||rHome)();
  }catch(e){
    const bar=$('errbar');
    if(bar){bar.style.display='block';bar.textContent='渲染出错：'+e.message}
  }
}

function taskRow(t){
  const c=tInfo(t.type).color;
  const dl=t.due?dDiff(today(),t.due):null;
  const over=t.stage!=='done'&&dl!==null&&dl<0;
  const done=t.stage==='done';
  return `<div class="tk">
    <div class="dot" style="background:${done?'var(--green)':c}"></div>
    <div class="body">
      <div class="ti" style="${done?'text-decoration:line-through;color:var(--sub)':''}">${esc(t.title)}</div>
      <div class="mt">${tgType(t.type)}${t.pn?`<span style="font-family:ui-monospace,monospace">${esc(t.pn)}</span>`:''}
        ${done?'<span style="color:var(--green)">已完成 ✓</span>':t.due?`<span style="color:${over?'var(--red)':dl<=3?'var(--amber)':'var(--sub)'}">${over?'逾期'+(-dl)+'天':'剩'+dl+'天'}</span>`:''}
        ${t.pri==='high'&&!done?'<span style="color:var(--red)">高优</span>':''}
      </div>
      ${done&&t.sum?`<div style="font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5">📝 ${esc(t.sum)}</div>`:''}
      ${done&&!t.sum?'<div style="font-size:11px;color:var(--amber);margin-top:4px">⚠ 还没写完成总结</div>':''}
    </div>
    <div style="display:flex;gap:4px;flex-shrink:0">
      ${done?`<button class="op" onclick="openSum('${t.id}')">${t.sum?'看总结':'写总结'}</button>`
            :`<button class="op" onclick="quickDone('${t.id}')">完成</button>`}
      <button class="op" onclick="openTask('${t.id}')">编辑</button>
    </div>
  </div>`;
}
/* 完成事项 + 写总结 */
function quickDone(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  t.stage='done';t.doneAt=t.doneAt||nowISO();
  save();openSum(id);
}
function openSum(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  openModal(`<h3>✅ 完成总结</h3>
  <div class="hint" style="margin-top:0">${esc(t.title)}</div>
  <label>工作内容总结</label>
  <textarea id="sText" style="min-height:130px" placeholder="做了什么、结果/数据、输出物。例：完成418工艺更新后人力重评，输出评估表，双班230→238人">${t.sum?esc(t.sum):''}</textarea>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" onclick="saveSum('${id}')">保存总结</button>
    <button class="btn gray" onclick="closeModal()">跳过</button>
  </div>`);
}
function saveSum(id){
  const v=$('sText').value.trim();
  if(!v){alert('请填写总结内容（跳过请点「跳过」）');return}
  const t=DB.tasks.find(x=>x.id===id);
  t.sum=v;t.stage='done';t.doneAt=t.doneAt||nowISO();
  save();closeModal();
}
function monthBars(){
  const ks=Object.keys(DB.monthly).sort();
  const max=Math.max(1,...ks.map(k=>DB.monthly[k]));
  return `<div class="bars">${ks.map(k=>{
    const v=DB.monthly[k]||0;
    return `<div title="${k}: ${v} 条"><div class="b" style="height:${Math.max(3,v/max*100)}%"></div><div class="l">${k.slice(5)}</div></div>`;
  }).join('')}</div>`;
}

function genReport(){
  const m=$('repM').value;
  const t=DB.tasks.filter(x=>monOf(x.created)===m||monOf(x.due)===m);
  const done=t.filter(x=>x.stage==='done');
  const parts=DB.parts.filter(p=>p.hours.some(h=>monOf(h.date)===m));
  const bens=DB.bens.filter(b=>monOf(b.date)===m);
  const newVers=DB.parts.flatMap(p=>p.hours.filter(h=>monOf(h.date)===m).map(h=>({pn:p.pn,name:p.name,h})));
  const money=bens.reduce((s,b)=>s+(+b.money||0),0);
  const byType={};
  parts.forEach(p=>{});
  newVers.forEach(v=>{
    const k=p=>p;
  });

  const L=[];
  L.push(`【IE 工作月报】${m}　${DB.owner} · ${DB.dept}`);
  L.push('');
  L.push(`一、本月概况`);
  L.push(`  · 处理工作项 ${t.length} 项，完成 ${done.length} 项`);
  L.push(`  · 涉及料号 ${parts.length} 个，工时版本更新 ${newVers.length} 次`);
  if(money)L.push(`  · 新增/验证效益 ${fmtN(money)} 元/月（折年 ${fmtN(money*12)} 元）`);
  L.push('');

  if(newVers.length){
    L.push(`二、标准工时测定与修订（${newVers.length} 项）`);
    newVers.forEach(v=>{
      L.push(`  · ${v.pn}｜${v.name || ''}`);
      L.push(`    ${v.h.ver}（${v.h.date}）${v.h.total?` 总成工时 ${fmtN(v.h.total)}s`:''} ${rInfo(v.h.reason).name}`);
      if(v.h.note)L.push(`    说明：${v.h.note}`);
    });
    L.push('');
  }
  if(bens.length){
    L.push(`三、计件方案与效益（${bens.length} 项）`);
    bens.forEach(b=>{
      L.push(`  · ${b.title}${b.pn?`（${b.pn}）`:''}`);
      L.push(`    成效：${b.desc}`);
      if(b.money)L.push(`    金额：${fmtN(b.money)} ${b.unit}`);
    });
    L.push('');
  }
  const mp=t.filter(x=>x.type==='manpower');
  if(mp.length){
    L.push(`四、人力评估（${mp.length} 项）`);
    mp.forEach(x=>{L.push(`  · ${x.title}`);if(x.detail)L.push(`    ${x.detail}`)});
    L.push('');
  }
  const other=t.filter(x=>x.type!=='manpower'&&x.type!=='jijian');
  if(other.length){
    L.push(`五、其他事项（${other.length} 项）`);
    other.forEach(x=>L.push(`  · [${tInfo(x.type).short}] ${x.title}${x.stage==='done'?'（已完成）':''}`));
    L.push('');
  }
  const open=DB.tasks.filter(x=>x.stage!=='done');
  if(open.length){
    L.push(`六、下月计划（${open.length} 项）`);
    open.forEach(x=>L.push(`  · [${tInfo(x.type).short}] ${x.title}${x.due?`（${x.due}）`:''}`));
  }
  $('reportBox').value=L.join('\n');
}

/* 记录工时新版本 */
function logVersion(pn){
  const p=DB.parts.find(x=>x.pn===pn);
  if(!p){alert('未找到该料号');return}
  const last=p.hours.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  const nv=(()=>{
    let maxMaj=0,maxMin=-1;
    (p.hours||[]).forEach(h=>{
      const m=/V(\d+)\.(\d+)/.exec(h.ver||'');
      if(m){
        const maj=+m[1],min=+m[2];
        if(maj>maxMaj||(maj===maxMaj&&min>maxMin)){maxMaj=maj;maxMin=min}
      }
    });
    if(maxMin<0)return 'V1.0';
    return 'V'+maxMaj+'.'+(maxMin+1);
  })();
  openModal(`<h3>记录工时新版本</h3><div class="sub">${esc(p.pn)}　${esc(p.name)}</div>
  <div class="r2">
    <div><label>版本号</label><input id="vVer" value="${nv}"></div>
    <div><label>日期</label><input type="date" id="vDate" value="${today()}"></div>
  </div>
  <label>总成工时（秒）</label><input type="number" step="0.01" id="vTotal" value="${last&&last.total?last.total:''}" placeholder="9706.63">
  <label>变更原因</label>
  <div class="chips" id="vReason">${DB.reasons.map((r,i)=>`<div class="chip ${i===0?'on':''}" data-k="${r.key}">${esc(r.name)}</div>`).join('')}</div>

  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" onclick="saveVersion('${esc(pn)}')">保存</button>
    <button class="btn gray" onclick="closeModal()">取消</button>
  </div>`);
  document.querySelectorAll('#vReason .chip').forEach(c=>{
    c.addEventListener('click',()=>{
      document.querySelectorAll('#vReason .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
    });
  });
}

  <div class="r2">
    <div><label>关联料号</label><input id="tPn" value="${t?esc(t.pn):''}" placeholder="500111-00163"></div>
    <div><label>截止日期</label><input type="date" id="tDue" value="${t?t.due:''}"></div>
  </div>
  <div class="r2">
    <div><label>优先级</label><select id="tPri">
      <option value="high" ${t&&t.pri==='high'?'selected':''}>高</option>
      <option value="mid" ${t&&t.pri==='mid'?'selected':''}>中</option>
      <option value="low" ${t&&t.pri==='low'?'selected':''}>低</option></select></div>
    <div><label>状态</label><select id="tStage">
      <option value="todo" ${t&&t.stage==='todo'?'selected':''}>未开始</option>
      <option value="running" ${t&&t.stage==='running'?'selected':''}>进行中</option>
      <option value="done" ${t&&t.stage==='done'?'selected':''}>已完成</option></select></div>
  </div>
  <label>详细内容</label><textarea id="tDetail">${t?esc(t.detail):''}</textarea>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" onclick="saveTask('${id||''}')">保存</button>
    <button class="btn gray" onclick="closeModal()">取消</button>
  </div>
  ${t?`<button class="btn red" style="width:100%;margin-top:8px" onclick="delTask('${t.id}')">删除</button>`:''}`);
  document.querySelectorAll('#tType .chip').forEach(c=>{
    c.addEventListener('click',()=>{
      document.querySelectorAll('#tType .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
    });
  });
}
function saveTask(id){
  const title=$('tTitle').value.trim();
  if(!title){alert('请填写标题');return}
  const tc=document.querySelector('#tType .chip.on');
  const data={
    title,type:tc?tc.dataset.k:'stdtime',pn:$('tPn').value.trim(),
    due:$('tDue').value,pri:$('tPri').value,stage:$('tStage').value,
    detail:$('tDetail').value.trim()
  };
  if(id){Object.assign(DB.tasks.find(x=>x.id===id),data)}
  else DB.tasks.push({id:uid(),created:nowISO(),...data});
  save();closeModal();
}
function delTask(id){
  if(!confirm('删除该事项？'))return;
  DB.tasks=DB.tasks.filter(x=>x.id!==id);
  save();closeModal();
}
/* 导出已完成工作总结 */
function exportDone(){
  const ds=DB.tasks.filter(t=>t.stage==='done').sort((a,b)=>(a.doneAt||a.created||'').localeCompare(b.doneAt||b.created||''));
  if(!ds.length){alert('还没有已完成的事项');return}
  const L=['【已完成工作总结】'+today()+'　'+DB.owner];
  L.push('');
  ds.forEach((t,i)=>{
    L.push((i+1)+'. '+t.title+'　'+(t.doneAt||t.created||'').slice(0,10)+(t.pn?'　'+t.pn:''));
    L.push('   类型：'+tInfo(t.type).name);
    L.push('   总结：'+(t.sum||'（未填写）'));
    L.push('');
  });
  $('reportBox').value=L.join('\n');
  $('reportBox').scrollIntoView({behavior:'smooth'});
  go('rep');
}

function saveBen(id){

function delBen(id){
